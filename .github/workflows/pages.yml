# ABOUTME: GitHub Actions workflow that exports the single-threaded Web/PWA build
# ABOUTME: and deploys it to GitHub Pages for browser and iPhone Safari play.
name: Deploy Web Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2 and Web export template
        run: |
          curl -fsSL -o godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          sudo mv Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          rm -f godot.zip

          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable
          curl -fsSL -o templates.tpz \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          unzip -q -j templates.tpz \
            templates/web_nothreads_release.zip \
            templates/icudt_godot.dat \
            templates/version.txt \
            -d ~/.local/share/godot/export_templates/4.7.2.stable
          rm -f templates.tpz
      - name: Export Web PWA build
        run: make web
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: builds/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
